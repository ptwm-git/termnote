name: Release
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
permissions:
  contents: read
jobs:
  check:
    uses: ./.github/workflows/check.yml
  package:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version identity
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          const manifest=JSON.parse(readFileSync('manifest.json','utf8'));
          const pkg=JSON.parse(readFileSync('package.json','utf8'));
          const lock=JSON.parse(readFileSync('package-lock.json','utf8'));
          const versions=JSON.parse(readFileSync('versions.json','utf8'));
          if(process.env.GITHUB_REF_NAME!==manifest.version||pkg.version!==manifest.version||lock.version!==manifest.version||lock.packages[''].version!==manifest.version||versions[manifest.version]!==manifest.minAppVersion)throw new Error('Release version mismatch');
          JS
      - run: npm ci
      - run: npm run build
      - run: node scripts/package.mjs
      - name: Stage standard files and checksums
        run: |
          cp main.js manifest.json styles.css dist/
          cd dist
          sha256sum main.js manifest.json styles.css agent-note-terminal-*.zip > SHA256SUMS
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: dist/*
      - name: Create reviewable release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft --title "TermNote $GITHUB_REF_NAME · 终端笔记" --notes-file "docs/release-${GITHUB_REF_NAME}.md"
