name: Check
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Windows'
        run: python -m pip install pywinpty
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: npm run build
      - name: Real OpenCode 1.19.3 protocol on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $agentDir = Join-Path $env:RUNNER_TEMP 'termnote-opencode'
          New-Item -ItemType Directory -Force $agentDir | Out-Null
          gh release download v1.19.3 --repo anomalyco/opencode --pattern opencode-windows-x64.zip --dir $agentDir
          Expand-Archive (Join-Path $agentDir 'opencode-windows-x64.zip') -DestinationPath $agentDir
          $env:TERMNOTE_OPENCODE = (Get-ChildItem $agentDir -Filter opencode.exe -Recurse | Select-Object -First 1).FullName
          npx --no-install tsx scripts/real-opencode.mts
